[project]
name = "finops-graphrag"
version = "0.1.0"
description = "GraphRAG pipeline for parsing financial documents into semantic knowledge graphs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "networkx>=3.1",  # simple_cycles(length_bound=...) used by CircularFlowRule
    "openai>=1.0.0",
    "instructor>=1.0.0",
    "python-dotenv>=1.0.0",
    "ollama>=0.6.2",
    "rich>=13.9.4",
    "scikit-learn>=1.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]
proxy = [
    "litellm[proxy]<1.92",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
# access-control-lab/ is a separate project with its own deps; run its tests from its own directory
testpaths = ["tests"]
